services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BIKE_REPAIR_DATABASE_PATH: /data/repair_orders.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - repair_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  repair_data:
